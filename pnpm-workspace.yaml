packages:
  - apps/*
  - packages/platform-*
  - packages/ui
  - packages/extensions/*

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

overrides:
  brace-expansion: 5.0.9
  minimatch@3.1.5>brace-expansion: 2.1.4
  fast-uri: 3.1.5
  hono: 4.12.34
  ip-address: 10.4.0
  postcss: 8.5.25
  react: 19.2.3
  react-dom: 19.2.3
  react-native-safe-area-context: 5.7.0
  undici: 7.29.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vitest: 4.1.10
  xcode>uuid: 11.1.1

# image-size 1.2.1 already contains the zero-sized JXL/HEIF box fix, and the
# remaining zero-length ICNS entry loop is patched below. The registry ranges
# do not distinguish patchedDependencies, so keep these exceptions paired with
# scripts/security-dependencies.test.ts until an upstream fixed release exists.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

patchedDependencies:
  expo-modules-jsi@57.0.4: patches/expo-modules-jsi@57.0.4.patch
  image-size@1.2.1: patches/image-size@1.2.1.patch
