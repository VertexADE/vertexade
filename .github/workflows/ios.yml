name: Build unsigned iOS app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'apps/mobile/**'
      - 'packages/platform-client/**'
      - 'packages/platform-contracts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Unsigned iOS simulator app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VERTEXADE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Expo-compatible Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.0'
      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate mobile app
        run: |
          pnpm --filter @vertexade/mobile check
          pnpm --filter @vertexade/mobile test:ci
      - name: Generate iOS native project
        run: pnpm --filter @vertexade/mobile exec expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build unsigned simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace VertexADE.xcworkspace \
            -scheme VertexADE \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/vertexade-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package app bundle
        run: |
          APP_PATH="$RUNNER_TEMP/vertexade-derived-data/Build/Products/Release-iphonesimulator/VertexADE.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/VertexADE-ios-simulator.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VertexADE-ios-simulator
          path: ${{ runner.temp }}/VertexADE-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
