name: Build and publish

on:
  pull_request:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac --universal
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set desktop release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          pnpm --dir apps/desktop pkg set version="$VERSION"
      - run: pnpm --filter @vertexade/web build
      - run: pnpm --filter @vertexade/desktop build:main
      - name: Smoke-test bundled web server
        shell: bash
        run: |
          node apps/desktop/dist/web/server/index.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              wait "$SERVER_PID"
            fi
            sleep 1
          done
          exit 1
      - name: Require signing and notarization for macOS releases
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - run: pnpm --filter @vertexade/desktop exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  npm-bundles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/server build
      - name: Set release versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          pnpm --dir apps/server pkg set version="$VERSION"
          pnpm --dir apps/desktop pkg set version="$VERSION"
      - run: mkdir -p artifacts
      - run: pnpm --filter ./apps/server pack --pack-destination artifacts
      - run: pnpm --filter @vertexade/desktop pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: artifacts/*.tgz
      - name: Publish npm packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [ "$(npm view "vertexade@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "vertexade@$VERSION is already published"
          else
            pnpm dlx npm@11.5.1 publish ./apps/server --access public
          fi
          if [ "$(npm view "@vertexade/desktop@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "@vertexade/desktop@$VERSION is already published"
          else
            pnpm dlx npm@11.5.1 publish ./apps/desktop --access public
          fi

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [electron, npm-bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
