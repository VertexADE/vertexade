name: Build and publish

on:
  pull_request:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-security:
    name: Release security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Security checks run in the dedicated pull request workflow
        if: github.event_name == 'pull_request'
        run: echo 'Release security is enforced by Security gates for pull requests.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        if: github.event_name != 'pull_request'
      - name: Scan complete Git history for secrets
        if: github.event_name != 'pull_request'
        run: mise x gitleaks@8.29.1 -- gitleaks git . --log-opts=--all --redact --no-banner --no-color
      - name: Install exact dependencies
        if: github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile
      - name: Audit dependency advisories and registry signatures
        if: github.event_name != 'pull_request'
        run: |
          pnpm audit --audit-level high
          pnpm audit signatures
      - name: Verify locally patched dependency protections
        if: github.event_name != 'pull_request'
        run: pnpm exec vp test run scripts/security-dependencies.test.ts

  electron:
    needs: release-security
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac --universal
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set desktop release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          pnpm --dir apps/desktop pkg set version="$VERSION"
      - run: pnpm --filter @vertexade/web build
      - run: pnpm --filter @vertexade/desktop build:main
      - name: Smoke-test bundled web server
        shell: bash
        run: |
          node apps/desktop/dist/web/server/index.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              wait "$SERVER_PID"
            fi
            sleep 1
          done
          exit 1
      - name: Require signing and notarization for macOS releases
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - run: pnpm --filter @vertexade/desktop exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  npm-bundles:
    needs: release-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/server build
      - name: Set release versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          pnpm --dir apps/server pkg set version="$VERSION"
          pnpm --dir apps/desktop pkg set version="$VERSION"
      - run: mkdir -p artifacts
      - run: pnpm --filter ./apps/server pack --pack-destination artifacts
      - run: pnpm --filter @vertexade/desktop pack --pack-destination artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: artifacts/*.tgz

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: npm-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages
          path: artifacts
      - name: Publish npm packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [ "$(npm view "vertexade@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "vertexade@$VERSION is already published"
          else
            pnpm dlx npm@11.5.1 publish "./artifacts/vertexade-$VERSION.tgz" --access public --provenance
          fi
          if [ "$(npm view "@vertexade/desktop@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "@vertexade/desktop@$VERSION is already published"
          else
            pnpm dlx npm@11.5.1 publish "./artifacts/vertexade-desktop-$VERSION.tgz" --access public --provenance
          fi

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [electron, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: electron-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
