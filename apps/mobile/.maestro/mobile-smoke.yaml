appId: com.vertexade.mobile
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        id: connection-submit
    commands:
      - tapOn:
          id: connection-url
      - eraseText
      - inputText: ${MAESTRO_FIXTURE_URL}
      - hideKeyboard
      - tapOn:
          id: connection-submit
- tapOn: PRs
- assertVisible:
    id: pull-request-fixture-1-299
- tapOn:
    id: open-pull-request-fixture-1-299
- assertVisible: Improve release quality
- tapOn:
    id: detail-tab-conversation
- assertVisible: Please verify this on a physical iPhone.
- tapOn:
    id: detail-tab-checks
- assertVisible: mobile-check
- tapOn:
    id: detail-tab-changes
- assertVisible: apps/mobile/app/index.tsx
- tapOn:
    id: workspace-detail-close
- tapOn:
    id: create-pullRequests
- tapOn:
    id: create-title
- inputText: Device smoke draft PR
- tapOn:
    id: create-repository-1
- tapOn:
    id: create-prompt
- inputText: Implement and verify the device smoke delivery.
- hideKeyboard
- tapOn:
    id: create-submit
- assertVisible: W-0002 created. Its agent will publish the draft PR when the work is ready.
- tapOn: Work
- assertVisible:
    id: work-item-fixture-1
- tapOn:
    id: open-work-item-fixture-1
- tapOn:
    id: detail-tab-threads
- tapOn:
    id: detail-thread-fixture-1
- assertVisible: Checking the iOS release flow.
- tapOn:
    id: detail-tab-changes
- assertVisible: apps/mobile/app/index.tsx
- tapOn:
    id: workspace-detail-close
- tapOn: Threads
- assertVisible:
    id: thread-fixture-1
- tapOn:
    id: open-thread-fixture-1
- assertVisible: Checking the iOS release flow.
- tapOn:
    id: detail-tab-context
- assertVisible: Original prompt
- tapOn:
    id: workspace-detail-close
- tapOn: More
- assertVisible:
    id: extension-work
- takeScreenshot: ${MAESTRO_TESTS_DIR}/01-connected

- tapOn:
    id: extension-work
- assertVisible: Work queue
- tapOn:
    id: record-work-1-action-start-thread
- assertVisible:
    id: action-modal
- assertVisible: Agent execution
- assertVisible: Codex
- tapOn:
    id: action-cancel
- back
- takeScreenshot: ${MAESTRO_TESTS_DIR}/02-work-agent-options

- tapOn:
    id: extension-agents
- assertVisible: Agents
- assertVisible: Codex
- back

- tapOn:
    id: extension-pull-requests
- assertVisible: Pull requests
- tapOn:
    id: record-pr-299-details
- assertVisible:
    id: record-details
- assertVisible: "#299 Improve release quality"
- tapOn:
    id: record-details-close
- back
- takeScreenshot: ${MAESTRO_TESTS_DIR}/03-pull-request-details

- tapOn:
    id: extension-settings
- assertVisible: Extension settings
- assertVisible:
    id: settings-settings
- tapOn:
    id: settings-field-label
- eraseText
- inputText: Device smoke updated
- hideKeyboard
- tapOn:
    id: settings-submit
- assertVisible: Fixture settings saved.
- tapOn:
    id: settings-action-reset
- assertVisible: Reset fixture settings?
- tapOn: Reset
- assertVisible: Fixture settings reset.
- takeScreenshot: ${MAESTRO_TESTS_DIR}/04-settings-reset
- back
- assertVisible:
    id: extension-work
